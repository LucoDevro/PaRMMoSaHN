name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Removed windows-latest because Bioconda does not support it
        os: [ubuntu-latest]
        # ppanggolin 2.2.0+ doenst work with python 3.13 yet
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    # 2. Replaced setup-python with setup-micromamba to test your actual environment
    - name: Setup Conda Environment
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: environment.yml
        create-args: >-
          python=${{ matrix.python-version }}
        cache-environment: true

    # 3. Notice the addition of `shell: micromamba-shell {0}` to all steps below!
    # This forces GitHub to run the commands INSIDE your newly created Conda environment.
    - name: Install dependencies
      shell: micromamba-shell {0}
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pandas-stubs

    - name: Lint with black
      shell: micromamba-shell {0}
      run: |
        black --check src/ tests/

    - name: Run tests
      shell: micromamba-shell {0}
      run: |
        pytest tests/ -v --tb=short

    - name: Type check with mypy
      shell: micromamba-shell {0}
      run: |
        mypy --install-types --non-interactive src/

  # 4. Your Build job remains EXACTLY the same! (Pure Python is fine for just building the .whl)
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # ONLY run this job if you push a tag that starts with "v" (like v0.1.0)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # Crucial: allows the bot to create a release on your repository

    steps:
    - uses: actions/checkout@v4

    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # Automatically generate release notes from your merged PRs
        generate_release_notes: true
        # Attach your compiled wheel, source code, and environment file to the release page!
        files: |
          dist/*
          environment.yml
