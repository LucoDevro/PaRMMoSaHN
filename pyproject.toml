[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parmmosahn"
version = "0.1.0"
description = "PaRMMoSaHN - Pangenome Reference-based Metabolic Modelling by Saving Homolog Networks"
authors = [{name = "Robbe De Win", email = "robbedewin@hotmail.com"}, {name = "Lucas De Vrieze", email = "lucas.devrieze@kuleuven.be"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "cobra>=0.29.0",     # For SBML model manipulation
    "pandas>=1.3.0",     # For dataframes
    "openpyxl>=3.0.0",   # Essential for reading your Excel curation DB
    "click>=8.0.0",      # For the CLI framework
    "memote>=0.13.0",    # For automated model curation
    "biopython>=1.79",   # For parsing GenBank files
    "polars>=1.0.0",      # For efficient data manipulation in curation
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.4",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "mypy>=0.910",
    "isort>=5.10.0",
]

[project.scripts]
# This exposes the command 'parmmosahn' to the terminal
parmmosahn = "parmmosahn.cli:main"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cobra.*",
    "pandas.*",
    "click.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = [
  "tests"
]

[tool.setuptools.package-data]
parmmosahn = ["data/*.yml"]
