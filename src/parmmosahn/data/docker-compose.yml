services:
  biggdb:
    image: mephenor/bigg_docker:1.6
    container_name: modelpolisher_biggdb
    hostname: biggdb
    ports:
      - 1310:5432

  adb:
    image: mephenor/adb_docker:0.1.1
    container_name: modelpolisher_adb
    hostname: adb
    ports:
      - 1013:5432

  # We keep the old validator service here solely so your Python
  # script doesn't crash when it runs `up -d ... validator`
  validator:
    image: schmirgel/sbmlvalidator:1.0.0
    hostname: sbmlvalidator

  polisher:
    image: mephenor/modelpolisher:2.1-beta
    depends_on:
      - biggdb
      - adb
    container_name: modelpolisher_java
    stdin_open: true
    tty: true
    # YOU MUST KEEP THESE VOLUMES for your Python code to work!
    volumes:
      - ${MODEL_DIR}:/models
      - ${OUTPUT_DIR}:/output
      - ${LOGS_DIR}:/logs
