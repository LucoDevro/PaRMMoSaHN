name: parmmosahn
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python>=3.9,<3.13
  - pip
  # External CLI tools
  - gapseq
  - ppanggolin
  - diamond
  - memote
  # Python packages
  - biopython
  - pandas
  - openpyxl  # for Excel file reading
  - cobra>=0.26.0  # COBRApy for metabolic models
  - pip:
    - -e .
