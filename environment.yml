name: parmmosahn_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # We leave Python somewhat loose here, because GitHub Actions will override it
  # during the matrix testing!
  - python>=3.10

  # Pin external binaries to specific minor versions
  - bioconda::ppanggolin=2.2.*
  - bioconda::gapseq=1.4.*
  - bioconda::diamond=2.1.*
  - numpy>=1.25,<2.0  # ppanggolin requires numpy<2.0
  - pip

  - pip:
    - .[dev]  # In the repo, this installs the local package and test dependencies
